# Install as /etc/nginx/conf.d/llm-council.conf. Change 8001 if that port is taken
# on the VPS (also set COUNCIL_PORT in the service file). TLS comes from Cloudflare.
server {
    listen 80;
    server_name council.smarketsherpa.ai;

    root /opt/llm-council/frontend/dist;
    index index.html;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # council answers stream (SSE) and can run for minutes
        proxy_buffering off;
        proxy_read_timeout 900s;
    }
    location / { try_files $uri /index.html; }
}
